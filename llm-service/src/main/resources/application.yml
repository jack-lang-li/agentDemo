server:
  port: 8081

spring:
  application:
    name: llm-service

logging:
  level:
    root: INFO
    com.example.agent: ${APP_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/llm-service.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  charset:
    console: UTF-8
    file: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

agent:
  model:
    provider: deepseek
    base-url: https://api.deepseek.com
    api-key: ${OPENAI_API_KEY}
    model: deepseek-flash
