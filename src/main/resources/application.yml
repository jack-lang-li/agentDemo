server:
  port: 8080

spring:
  application:
    name: spring-agent-learning

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

agent:
  model:
    provider: deepseek
    base-url: https://api.deepseek.com
    api-key: ${OPENAI_API_KEY}
    model: deepseek-flash
