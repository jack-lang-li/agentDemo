server:
  port: 8080

  servlet:
    session:
      # 空闲超时，不是从登录开始计算的绝对有效期。
      timeout: 30m

      tracking-modes: cookie

      cookie:
        http-only: true
        same-site: lax

        # 本地 HTTP 为 false。
        # 后续 HTTPS 部署环境应设置为 true。
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: business-service
  sql:
    init:
      # 表结构统一由 Flyway 管理。
      mode: never

  flyway:
    enabled: true

    # 本阶段使用 MySQL 专用迁移目录。
    locations: classpath:db/migration/mysql

    # 启动时检查已执行迁移与当前文件是否一致。
    validate-on-migrate: true

    # 使用新的开发库，不自动接管已有的非空数据库。
    baseline-on-migrate: false

    # 禁用 Flyway 清库操作。
    clean-disabled: true

mybatis-plus:
  configuration:
    # user_id 等数据库列映射为 userId 等 Java 属性。
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.example.agent: ${APP_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/business-service.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  charset:
    console: UTF-8
    file: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

agent:
  model:
    provider: deepseek
    base-url: https://api.deepseek.com
    api-key: ${OPENAI_API_KEY}
    model: deepseek-flash

dify:
  base-url: ${DIFY_BASE_URL:https://api.dify.ai/v1}
  api-key: ${DIFY_API_KEY}
  connect-timeout-millis: 10000
  read-timeout-millis: 90000
