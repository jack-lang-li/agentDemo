server:
  port: 8080

spring:
  application:
    name: business-service

logging:
  level:
    root: INFO
    com.example.agent: ${APP_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/business-service.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  charset:
    console: UTF-8
    file: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

agent:
  model:
    provider: deepseek
    base-url: https://api.deepseek.com
    api-key: ${OPENAI_API_KEY}
    model: deepseek-flash

dify:
  base-url: ${DIFY_BASE_URL:https://api.dify.ai/v1}
  api-key: ${DIFY_API_KEY}
  connect-timeout-millis: 10000
  read-timeout-millis: 90000
